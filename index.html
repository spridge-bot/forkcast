<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f3f1" media="(prefers-color-scheme: light)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<title>Forkcast</title>
<script>try{var t=localStorage.getItem("fc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header>
  <div class="bar-in">
    <a class="mark" href="#" onclick="go(0);return false" aria-label="Forkcast: start">
      <!-- a fork whose tines are a rising bar chart: the week's food, forecast -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="tine" x="5" y="9" width="2.6" height="7" rx="1.3"/><rect class="tine" x="9" y="6" width="2.6" height="10" rx="1.3"/><rect class="tine" x="13" y="3.5" width="2.6" height="12.5" rx="1.3"/><rect class="tine" x="17" y="1.5" width="2.6" height="14.5" rx="1.3"/><rect class="handle" x="5" y="14.5" width="14.6" height="2.6" rx="1.3"/><rect class="handle" x="11" y="16" width="2.6" height="7" rx="1.3"/></svg>
      <span>FORKCAST</span>
    </a>
    <nav class="steps" id="steps" aria-label="Steps">
      <button data-s="0">Tastes</button>
      <button data-s="1">Week</button>
      <button data-s="2">List</button>
      <button data-s="3">Compare</button>
      <button data-s="4">Order</button>
      <button data-s="5">Recipes</button>
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme" title="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<script>
document.getElementById("theme-btn").addEventListener("click", function () {
  var r = document.documentElement, cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  var next = cur === "light" ? "dark" : "light"; r.setAttribute("data-theme", next);
  try { localStorage.setItem("fc-theme", next); } catch (e) {}
});
</script>
<script>window.FORKCAST_STATIC = 1;</script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>

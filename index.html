<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f3f1" media="(prefers-color-scheme: light)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Forkcast</title>
<script>try{var t=localStorage.getItem("fc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header>
  <div class="bar-in">
    <a class="mark" href="#" onclick="go(0);return false" aria-label="Forkcast: start">
      <!-- a fork whose tines rise like a bar chart: the week's food, forecast -->
      <svg class="logo" viewBox="0 0 28 32" aria-hidden="true"><rect class="tine" x="3" y="11" width="3.4" height="9" rx="1.7"/><rect class="tine" x="8.6" y="7" width="3.4" height="13" rx="1.7"/><rect class="tine" x="14.2" y="3.5" width="3.4" height="16.5" rx="1.7"/><rect class="tine" x="19.8" y="1" width="3.4" height="19" rx="1.7"/><path class="handle" d="M3 18.5h20.2v1.2a5 5 0 0 1-5 5h-3.4v6.1a1.7 1.7 0 0 1-3.4 0v-6.1H8a5 5 0 0 1-5-5z"/></svg>
      <span class="word"><span><b>FORK</b><i>cast</i></span></span>
    </a>
    <nav class="steps" id="steps" aria-label="Steps">
      <button data-s="0">Tastes</button>
      <button data-s="1">Plan</button>
      <button data-s="2">Shop</button>
      <button data-s="3">Cook</button>
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme" title="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<script>
document.getElementById("theme-btn").addEventListener("click", function () {
  var r = document.documentElement, cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  var next = cur === "light" ? "dark" : "light"; r.setAttribute("data-theme", next);
  try { localStorage.setItem("fc-theme", next); } catch (e) {}
});
</script>
<script>window.FORKCAST_STATIC = 1;</script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
